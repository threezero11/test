<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#cbd5e1" />
    </marker>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="200" fill="#f8fafc" />

  <!-- 화살표 라인 -->
  <line x1="160" y1="100" x2="220" y2="100" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="340" y1="100" x2="400" y2="100" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="520" y1="100" x2="580" y2="100" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="700" y1="100" x2="760" y2="100" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- 단계 1: 기획 -->
  <g>
    <rect x="40" y="60" width="120" height="80" rx="12" fill="#fce7f3" stroke="#fbcfe8" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="92" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#be185d">📋</text>
    <text x="100" y="125" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#be185d">기획</text>
  </g>

  <!-- 단계 2: 제작 -->
  <g>
    <rect x="220" y="60" width="120" height="80" rx="12" fill="#fef3c7" stroke="#fde68a" stroke-width="2" filter="url(#shadow)" />
    <text x="280" y="92" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#b45309">🎨</text>
    <text x="280" y="125" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b45309">제작</text>
  </g>

  <!-- 단계 3: 검토 -->
  <g>
    <rect x="400" y="60" width="120" height="80" rx="12" fill="#dbeafe" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)" />
    <text x="460" y="92" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1e40af">✓</text>
    <text x="460" y="125" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1e40af">검토</text>
  </g>

  <!-- 단계 4: 배포 -->
  <g>
    <rect x="580" y="60" width="120" height="80" rx="12" fill="#d1fae5" stroke="#a7f3d0" stroke-width="2" filter="url(#shadow)" />
    <text x="640" y="92" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#065f46">🚀</text>
    <text x="640" y="125" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#065f46">배포</text>
  </g>

  <!-- 단계 5: 분석 -->
  <g>
    <rect x="760" y="60" width="120" height="80" rx="12" fill="#e9d5ff" stroke="#ddd6fe" stroke-width="2" filter="url(#shadow)" />
    <text x="820" y="92" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#6b21a8">📊</text>
    <text x="820" y="125" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6b21a8">분석</text>
  </g>

  <!-- 단계명 하단 라벨 (옵션, 더 읽기 쉽게) -->
  <text x="100" y="165" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="11" text-anchor="middle" fill="#64748b" opacity="0.8">개념 수립</text>
  <text x="280" y="165" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="11" text-anchor="middle" fill="#64748b" opacity="0.8">콘텐츠 제작</text>
  <text x="460" y="165" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="11" text-anchor="middle" fill="#64748b" opacity="0.8">품질 검증</text>
  <text x="640" y="165" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="11" text-anchor="middle" fill="#64748b" opacity="0.8">배포 실행</text>
  <text x="820" y="165" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="11" text-anchor="middle" fill="#64748b" opacity="0.8">성과 분석</text>
</svg>
